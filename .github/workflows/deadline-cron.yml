name: SAMAY Automated Deadline Processor

on:
  schedule:
    # Run once daily at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  trigger-statutory-deadlines:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deadline Scanning API
        env:
          APP_BASE_URL: ${{ secrets.SAMAY_APP_URL || 'https://samay.aicte-india.org' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured in repository secrets."
            exit 1
          fi
          curl -f -sS -X POST "${APP_BASE_URL}/api/cron/process-deadlines" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}"
